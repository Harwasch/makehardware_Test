# Project plan — the agreement about what work exists and in what order.
#
# One chunk ≈ one AI session. Keep chunks at the altitude of "a thing you could
# hand to a session and get a reviewable result back", not individual tasks.
#
#   status:       todo | in_progress | blocked | done
#   depends_on:   chunk ids that must finish first (this drives the schedule)
#   discipline:   groups rows in the chart; use only what the project needs
#   outputs:      files this chunk is expected to produce
#
# Render with:  plan-render            (updates docs/plan.svg and README)
# Validate with: plan-render --check   (exit 1 on cycles, dangling deps)

project: Ulysses LARS Charger
disciplines: [electrical, firmware, mechanical, test, documentation]

chunks:

  # ---- agreements ----------------------------------------------------------
  - id: V1
    title: Vision, v1 baseline review and link budget
    discipline: documentation
    status: in_progress
    depends_on: []
    estimate_sessions: 1
    review: vision
    outputs: [requirements/00-vision.sdoc, docs/design/vision.md, docs/design/vision/, docs/design/v1-baseline.md, sim/link-budget/link_budget.py, concepts/]
    notes: >-
      Artefacts complete and pushed; the AGREEMENT on them is not. Held at
      in_progress because review 'vision' is open and unsigned - the stage's
      own exit condition. The related gate chunk is G1, which is still
      open — the vision stage's exit condition was never met, so the plan and
      requirements downstream were built on an unreviewed vision. Established that the v1 magnetics cannot reach 3 kW and that coil-to-coil
      efficiency is the constraint that decides the architecture.

  - id: G1
    title: Vision review gate — the human agrees the concepts and the numbers
    discipline: documentation
    status: in_progress
    depends_on: [V1]
    estimate_sessions: 1
    review: vision
    outputs: [docs/review/vision.md, docs/review/gate-1-vision-record.md]
    notes: >-
      The agreement the workflow requires and never got. Three docking
      arrangements are in front of the human with the corrected coil analysis;
      five questions are open. Design chunks depend on this rather than on V1,
      because designing against an unagreed vision is what produced two bare
      coil pads when the human wanted to see a product. CLOSED: belly dock, no
      actuator, charging on deck, scope limited to the charging system, 4 x 8
      inch pad, and PCB kept per ADR-0001. CLOSED 2026-08-31: scope narrowed to
      the electronics plus a test packaging (VIS-013), integration and the
      fixture to the mechanical team, and the locating scheme set to pins
      (VIS-005). The three locating concepts are withdrawn and MEC-009 re-aimed
      as an interface requirement rather than deleted with them. RE-OPENED under
      the v0.2.0 review mechanism: these decisions were taken in chat and are
      not yet signed into the ledger.

  - id: R1
    title: System and discipline requirements from the agreed vision
    discipline: documentation
    status: in_progress
    depends_on: [V1]
    estimate_sessions: 1
    review: requirements
    outputs: [requirements/10-system.sdoc, requirements/20-electrical.sdoc, requirements/20-mechanical.sdoc, requirements/20-firmware.sdoc, docs/design/requirements-map.svg]
    notes: >-
      Requirements are written against k*Q and pad dissipation, not against a
      coil technology, so the M2 decision is settled on evidence.

  - id: R2
    title: Environmental envelope from the marine standards
    discipline: documentation
    status: in_progress
    depends_on: [V1]
    estimate_sessions: 1
    outputs: [docs/design/environment.md]
    notes: >-
      Design ambient for an open-deck enclosure on a surface vessel operating
      worldwide, traced to IEC 60945, IACS UR E10 and classification-society
      rules rather than assumed. Feeds SYS-007 and MEC-004, and blocks the
      thermal work in M3. Work complete; held at in_progress because it rests
      on an unsigned vision - if the review moves the application away from an
      open deck, the +55 C envelope moves with it.

  # ---- magnetics: the critical path ----------------------------------------
  - id: M1
    title: Coil electromagnetic modelling — predict L, R_ac, Q and k by analysis
    discipline: mechanical
    status: in_progress
    depends_on: [R1]
    estimate_sessions: 2
    outputs: [sim/coil/coil_rect.py, sim/coil/, docs/design/coil-model.md]
    notes: >-
      CRITICAL PATH AND EARLIEST RISK, and now an analysis chunk rather than a
      bench one: no laboratory access, so the quality factor the whole
      architecture rests on must be predicted from first principles and
      defended. Self-inductance from Wheeler and Mohan, mutual inductance and
      coupling from Maxwell's coaxial-filament formula summed over turns, AC
      resistance from skin and proximity models for both an etched spiral and a
      Litz bundle. Validated against published MEASURED data for comparable
      coils, because a model with no measurement behind it anywhere is not
      evidence. The v1 numbers are internally inconsistent — a stated Q of 12
      implies 127 kHz, not the stated 85 kHz — so they cannot serve as the
      check.

      DONE, and CORRECTED. The house coil is a 102 x 203 mm rectangle, not a
      circle, and the first analysis generalised a single-layer result to a whole
      conductor technology. Recomputed with coil_rect.py: 32 turns of 0.80 mm
      trace in 4 oz with SIX LAYERS in parallel reaches k*Q = 77 worst case
      against the 49 required. Fine traces nearly remove proximity effect
      (R_ac/R_dc 1.06), so the coil becomes a DC-resistance problem that layers
      fix. An etched coil MEETS MEC-001. Inter-layer proximity is now the largest
      modelling uncertainty and is the first FEA task in M2.

      Analysis complete and reproducible; held at in_progress because it rests
      on an unsigned vision and on ADR-0001, whose 4 x 8 inch pad and 16-layer
      stack are both questions still in front of the human.

  - id: M2
    title: Coil technology decision, magnetics design and compensation network
    discipline: mechanical
    status: todo
    depends_on: [M1, G1]
    estimate_sessions: 2
    outputs: [docs/design/adr-0001-coil-technology.md, cad/coil_pad.py, docs/design/magnetics.md]
    notes: >-
      Picks PCB or Litz against M1's predictions, then sizes turns, geometry,
      ferrite and the series tuning capacitor. The tank capacitor is a real part
      nobody has specified — roughly 22 nF standing off 720 V rms and carrying
      the full 8.3 A of tank current.

  - id: M3
    title: Coil pad thermal design, conduction path and packaging
    discipline: mechanical
    status: todo
    depends_on: [M2]
    estimate_sessions: 2
    outputs: [cad/coil_pad.py, sim/thermal/, docs/design/thermal.md]
    notes: >-
      gmsh + CalculiX. VIS-006 allows no coolant, so this chunk is what proves
      the M2 choice survives. The dock enclosure sits on OPEN DECK on a surface
      vessel operating worldwide, so the ambient envelope comes from the marine
      standards plus solar gain — settled in R2. MEC-009 is now an INTERFACE
      requirement on a structure the mechanical team builds (VIS-013), so this
      chunk owes them a number — required surface area and interface thermal
      resistance — not just a pad design. It also owes the 150 W/m2 still-air
      figure a second source; it is single-sourced and the whole 12x follows
      from it.

  - id: M4
    title: Test packaging design — pin locating, shim-set gap, its own heat sink
    discipline: mechanical
    status: todo
    depends_on: [M2, M3]
    estimate_sessions: 2
    outputs: [cad/test_packaging.py, docs/design/test-packaging.md]
    notes: >-
      SYS-017 and MEC-010. The bench rig that holds the coil pair at the SYS-006
      envelope, without which MEC-001, MEC-003 and SYS-006 cannot be verified at
      all — every one of them is written "across the envelope" and the corners
      are where they are closest to failing. Concept geometry already exists in
      concepts/test_packaging.py; this chunk takes it to a buildable part with
      tolerances on the pin pattern and a shim schedule. It must meet MEC-009
      itself, because a thermal measurement on a rig with a smaller heat sink
      would understate the temperature the delivered system runs at.

  # ---- electrical ----------------------------------------------------------
  - id: E1
    title: Power architecture, topology and part selection
    discipline: electrical
    status: todo
    depends_on: [R1, G1]
    estimate_sessions: 2
    outputs: [docs/design/adr-0002-tx-power-stage.md, docs/reference/manifest.yaml]
    notes: >-
      TX power stage now settled by ADR-0002 (LMG3526R030, verified against
      SNOSDF3B). Remaining: the RX rectifier technology, the DAB switches for
      both sides, the isolation set against the 800 V reinforced requirement,
      and the resonant capacitor. Bidirectional operation is confirmed
      required, and the 700 V offline aux stage is no longer needed now that
      both docks have a 48 V pack.

  - id: E1B
    title: Block diagram and power budget across all three boards
    discipline: electrical
    status: in_progress
    depends_on: [E1, M2]
    estimate_sessions: 1
    review: architecture
    outputs: [hw/block-diagram.yaml, docs/design/block-diagram.svg,
              scripts/block_sheets.py, hw/sheets/]
    notes: >-
      Provisional diagram written and block-diagram --check passes, but the
      currents are estimates: this chunk cannot close until E1 settles the
      parts and M2 the magnetics. It already forced two findings — the aux
      rail cannot be fed from a 60 V-input part on a 400 V bus, and 600 mA is
      not enough for the TX aux tree.

  - id: E2
    title: TX board schematic capture and ERC
    discipline: electrical
    status: todo
    depends_on: [E1B]
    estimate_sessions: 2
    outputs: [hw/tx/tx.kicad_sch]
    notes: GaN H-bridge, aux rails, current sense, STM32H723.

  - id: E3
    title: RX board schematic capture and ERC
    discipline: electrical
    status: todo
    depends_on: [E1B]
    estimate_sessions: 1
    outputs: [hw/rx/rx.kicad_sch]
    notes: >-
      Rectifier, bulk, isolated current sense, STM32G431. The v1 bridge is
      ultrafast silicon described as Schottky; evaluate SiC Schottky and
      synchronous rectification against the 26 W the diode bridge costs.

  - id: E4
    title: HVLV dual-active-bridge schematic capture and ERC
    discipline: electrical
    status: todo
    depends_on: [E1B]
    estimate_sessions: 2
    outputs: [hw/hvlv/hvlv.kicad_sch]
    notes: >-
      48 V LV side carries 62.5 A at 3 kW. The v1 two-FETs-per-branch choice
      dissipates 74 W in conduction alone; more paralleling or a lower-R part.

  - id: E5
    title: TX PCB layout, DRC and fabrication outputs
    discipline: electrical
    status: todo
    depends_on: [E2, S2]
    estimate_sessions: 2
    outputs: [hw/tx/tx.kicad_pcb, build/fab/tx/]
    notes: GaN switching loop and gate loop inductance dominate this layout.

  - id: E6
    title: RX PCB layout, DRC and fabrication outputs
    discipline: electrical
    status: todo
    depends_on: [E3]
    estimate_sessions: 1
    outputs: [hw/rx/rx.kicad_pcb, build/fab/rx/]

  - id: E7
    title: HVLV PCB layout, DRC and fabrication outputs
    discipline: electrical
    status: todo
    depends_on: [E4, S2]
    estimate_sessions: 2
    outputs: [hw/hvlv/hvlv.kicad_pcb, build/fab/hvlv/]
    notes: 62.5 A of LV copper and a planar transformer in the stackup.

  - id: E8
    title: In-band communication link — modulation, demodulation and damping
    discipline: electrical
    status: todo
    depends_on: [E1, M2]
    estimate_sessions: 2
    outputs: [docs/design/in-band-comms.md, docs/design/adr-0004-comms.md, sim/comms/]
    notes: >-
      Data over the power coils. The binding constraint is that the tank is a
      bandpass filter whose bandwidth swings 50x with load: 43 kHz at 3 kW but
      only 867 Hz at no load, which is exactly when the handshake happens.
      Includes the switched damping network that buys that bandwidth back, and
      its hardware interlock — 22 ohm across the tank at full drive is 5.9 kW.

  - id: E9
    title: Leviathan-side instance — configuration, harness and commissioning
    discipline: electrical
    status: todo
    depends_on: [E4, E7]
    estimate_sessions: 1
    outputs: [docs/design/adr-0005-dab-instances.md, docs/design/interfaces.md]
    notes: >-
      UNBLOCKED. The Leviathan pack is 48 V nominal, the same as the Mako's, so
      one low-voltage specification covers both ends and the two instances are
      the same board with different firmware configuration and orientation.
      What is left here is the dock harness — which carries 48 V for the
      transmitter's auxiliary rails alongside the 400 V link — the
      commissioning differences, and the interface document.

  # ---- simulation ----------------------------------------------------------
  - id: S1
    title: Resonant link simulation, cross-checked against the closed form
    discipline: test
    status: todo
    depends_on: [M2, E1]
    estimate_sessions: 1
    outputs: [sim/link/, docs/design/link-simulation.md]
    notes: >-
      ngspice model of the compensated link. Must reconcile with
      sim/link-budget/link_budget.py; a disagreement means one of them is wrong.

  - id: S2
    title: Power stage simulation — ZVS, dead time and switching loss
    discipline: test
    status: todo
    depends_on: [E1]
    estimate_sessions: 1
    outputs: [sim/power-stage/, docs/design/switching.md]
    notes: >-
      Dead time is safety-critical here and v1 never set it in firmware at all.
      Sweep corners; a dead time that works at 25 C and shoots through at 85 C
      is the failure this chunk exists to catch.

  # ---- firmware ------------------------------------------------------------
  - id: F1
    title: TX resonance-tracking firmware rework
    discipline: firmware
    status: todo
    depends_on: [E1B]
    estimate_sessions: 2
    outputs: [fw/tx/]
    notes: >-
      Keep the validated two-stage architecture; fix the eight findings. The
      filter is a median where the paper claims RMS, the smoothing branch is
      dead code, the re-sweep guard can never fire, and dead time is never set.

  - id: F2
    title: HVLV CC/CV control firmware with real constants
    discipline: firmware
    status: todo
    depends_on: [E1B]
    estimate_sessions: 2
    outputs: [fw/hvlv/]
    notes: >-
      Every control constant in v1 is a FILL THIS OUT LATER placeholder, the
      phase shift is gated behind a condition that can never be true, and the
      50 us control ISR does blocking ADC polls with a 1 ms timeout.

  - id: F3
    title: Protection, fault handling and safe-state behaviour
    discipline: firmware
    status: todo
    depends_on: [F1, F2, S2]
    estimate_sessions: 1
    outputs: [fw/common/, docs/design/adr-0003-protection.md]
    notes: >-
      Hardware break inputs, over-current and over-voltage trips, coupling-loss
      detection, and the charge-rate limit the present 1.58 kWh pack needs.
      v1 has none of this: TIM break is disabled everywhere.

  - id: F4
    title: Link protocol, handshake and coexistence with resonance tracking
    discipline: firmware
    status: todo
    depends_on: [E8, F1]
    estimate_sessions: 2
    outputs: [fw/common/comms/, docs/design/protocol.md]
    notes: >-
      Framing, CRC and the SYS-013 interlock that keeps the dock at handshake
      power until a receiver identifies itself. The load-shift keying and the
      resonance hill-climb use the same quantity in opposite directions and
      will fight unless blanked against each other.

  # ---- close-out -----------------------------------------------------------
  - id: T1
    title: Analysis and simulation close-out against the requirements
    discipline: test
    status: todo
    depends_on: [E5, E6, E7, F3, F4, M3, S1]
    estimate_sessions: 2
    outputs: [docs/design/verification-report.md]
    notes: >-
      Everything closeable without a laboratory: the Analysis and Simulation
      requirements, the budget roll-ups, ERC and DRC. req-trace --gate will
      still exit 1, because every Test requirement stays open until T2. Report
      the number it prints, gaps first, and do not restate a Test requirement as
      an Analysis one to make the gate pass.

  - id: T2
    title: Bench verification — deferred until laboratory access
    discipline: test
    status: blocked
    depends_on: [T1, M4]
    estimate_sessions: 3
    outputs: [docs/design/verification-report.md]
    notes: >-
      OUT OF SCOPE FOR NOW by instruction: no laboratory work. Held in the plan
      rather than deleted, because the Test-method requirements are real and
      the coil quality factor in particular is a prediction until something is
      measured. This chunk is what closes them.

  - id: D1
    title: Design record — ADRs, architecture and interfaces consolidated
    discipline: documentation
    status: todo
    depends_on: [M2, E1B]
    estimate_sessions: 1
    outputs: [docs/design/architecture.md, docs/design/interfaces.md]

  - id: D2
    title: User documentation and spec sheet
    discipline: documentation
    status: todo
    depends_on: [T1]
    estimate_sessions: 1
    outputs: [docs/user/]
