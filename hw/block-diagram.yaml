# Electrical block diagram — the architecture agreement, settled before schematic capture.
#
#   block-diagram                 # -> hw/block-diagram.drawio + docs/design/block-diagram.svg
#   block-diagram --check         # validate only; exit 1 on a broken tree or an over-budget rail
#   block-diagram --summary       # power budget per rail, no files written
#
# STATUS: PROVISIONAL. Chunk E1B in plan.yaml depends on E1 (part selection) and
# M2 (magnetics), neither of which has run. The architecture and the tree shape
# are agreed here; the currents marked (est) below are engineering estimates and
# must be replaced with datasheet figures before E1B closes. Every part whose
# datasheet has not been fetched is recorded blocked in
# docs/reference/manifest.yaml.
#
# The power tree drawn here is the CHARGING-MODE tree. The vehicle pack also
# back-feeds the vehicle auxiliary rails when no charge is in progress, which the
# single-source tree below cannot express; see docs/design/in-band-comms.md for
# why that path matters (the receiver has to be awake to answer a handshake).

project: Ulysses LARS Charger
revision: B

# --------------------------------------------------------------------------
# Power tree.
#
# The coils are the boundary of the wired tree: HVDC has no `from` because its
# energy arrives across the magnetic link, not along a conductor.
# --------------------------------------------------------------------------
rails:

  # ---- dock side ----
  - id: HV400
    voltage: 400.0
    source: J1
    max_current_a: 10.0
    notes: >-
      Dock bus. 3 kW at 400 V is 7.5 A; 9 A sizes the source above the load.
      Whether the Leviathan supplies 400 V directly or through a step-up DAB is
      an open question — see docs/design/v1-baseline.md.

  - id: TXA24
    voltage: 24.0
    source: U4
    max_current_a: 1.2
    notes: >-
      Isolated flyback off the 400 V bus; the only part that can take 400 V in.
      No `from` because the barrier is galvanic — U4's declared draw on HV400 is
      the referred current, which is the honest way to carry it across.

  - id: TX12
    voltage: 12.0
    from: TXA24
    source: U5
    max_current_a: 1.5
    notes: >-
      Gate-drive and isolated-bias input rail. Sized at 1.5 A, not the 600 mA a
      TPSM560R6 gives: the first pass of this budget came out over on a 600 mA
      part, which is the concrete form of the v1 white paper's confusion between
      "TPSM540" and "TPSM560".

  - id: TX3V3
    voltage: 3.3
    from: TX12
    source: U6
    max_current_a: 0.5
    notes: >-
      TX digital and analog domain. Generated by a buck, not an LDO: 400 mA
      dropped from 12 V to 3.3 V is 3.5 W of heat on a board that already has
      nowhere to put any.

  # ---- vehicle side ----
  - id: HVDC
    voltage: 400.0
    source: U10
    max_current_a: 10.0
    notes: >-
      Rectified link output. No `from` — this rail is fed across the coils, so
      it is where the wired tree restarts on the vehicle.

  - id: V48
    voltage: 48.0
    source: U22
    max_current_a: 80.0
    notes: >-
      Pack rail. 3 kW at 48 V is 62.5 A, and 75 A at the bottom of the SYS-003
      window; 80 A is the continuous rating the LV bridge and its copper are
      designed to (ELE-008). No `from` — the DAB is galvanically isolated, and
      U20's declared draw on HVDC is the referred current.

  - id: VEH12
    voltage: 12.0
    from: V48
    source: U26
    max_current_a: 1.5
    notes: vehicle gate-drive and isolated-bias input rail, RX and HVLV together

  - id: VEH3V3
    voltage: 3.3
    from: VEH12
    source: U27
    max_current_a: 0.8
    notes: vehicle digital and analog domain, RX and HVLV together

# --------------------------------------------------------------------------
# Blocks.
# --------------------------------------------------------------------------
blocks:

  # ======================= DOCK / TX BOARD =======================
  - id: J1
    name: Dock bus input
    kind: connector
    part: TBD-400V-8A

  - id: U1
    name: TX bridge leg A (2x GaN)
    kind: power
    part: LMG3522R030
    powered_by:
      - rail: HV400
        typ_current_a: 3.75
        max_current_a: 4.20
      - rail: TX12
        typ_current_a: 0.060
        max_current_a: 0.090
    notes: >-
      Replaces the v1 LMG2610, which is specified for <75 W flyback and would
      see 2.9x its high-side absolute maximum here. 650 V / 30 mohm satisfies
      ELE-005 and ELE-006. HV400 draw is half the 7.5 A bus current per leg.

  - id: U2
    name: TX bridge leg B (2x GaN)
    kind: power
    part: LMG3522R030
    powered_by:
      - rail: HV400
        typ_current_a: 3.75
        max_current_a: 4.20
      - rail: TX12
        typ_current_a: 0.060
        max_current_a: 0.090

  - id: U3
    name: TX isolated gate bias
    kind: regulator
    part: UCC14240-Q1
    powered_by:
      - rail: TX12
        typ_current_a: 0.180
        max_current_a: 0.250
    notes: (est) 2 W out at ~80% — confirm against the datasheet

  - id: U4
    name: TX aux flyback 400V to 24V
    kind: regulator
    part: TBD-700V-30W-flyback
    powered_by:
      - rail: HV400
        typ_current_a: 0.030
        max_current_a: 0.045
    notes: >-
      NEW IN v2. The v1 white paper drives the aux rails from a "TPSM540/TPSM560",
      but every real part in that family is rated 60 V maximum input and cannot
      run from a 400 V bus at all. An intermediate isolated stage is required,
      and it has to be a 700 V-class offline flyback — this is a design problem
      of its own, not a part substitution. Left TBD for E1.

  - id: U5
    name: TX aux buck 24V to 12V
    kind: regulator
    part: TPSM5601R5
    powered_by:
      - rail: TXA24
        typ_current_a: 0.005
        max_current_a: 0.008

  - id: U6
    name: TX digital buck 12V to 3.3V
    kind: regulator
    part: TPSM560R6
    powered_by:
      - rail: TX12
        typ_current_a: 0.002
        max_current_a: 0.004

  - id: U7
    name: TX controller
    kind: mcu
    part: STM32H723ZGT6
    powered_by:
      - rail: TX3V3
        typ_current_a: 0.250
        max_current_a: 0.400
    notes: (est) retained from v1 — advanced timers and fast ADC are the reason

  - id: U8
    name: Tank current sense amplifier
    kind: analog
    part: OPA2328
    powered_by:
      - rail: TX3V3
        typ_current_a: 0.008
        max_current_a: 0.012
    notes: 1 MHz / 2% chain per ELE-010

  - id: U9
    name: Handshake damping switch
    kind: power
    part: TBD-relay-or-FET
    powered_by:
      - rail: TX12
        typ_current_a: 0.020
        max_current_a: 0.040
    notes: >-
      ELE-016. Switches ~22 ohm across the tank to widen the no-load bandwidth
      from 867 Hz to 22.5 kHz for the handshake. Must be interlocked in
      hardware — the same network at full drive dissipates 5.9 kW.

  - id: C1
    name: TX resonant capacitor bank
    kind: other
    part: TBD-1500V-12Arms
    notes: >-
      ELE-007. ~22 nF standing off 720 V rms and carrying the full 8.33 A of
      tank current. Absent from the v1 white paper entirely.

  - id: L1
    name: TX coil assembly
    kind: other
    part: TBD-162uH-kQ49
    notes: MEC-001..004. Technology decided by ADR against a measured Q.

  - id: J2
    name: TX debug header
    kind: connector
    part: FTSH-105-01

  # ======================= VEHICLE / RX =======================
  - id: L2
    name: RX coil assembly
    kind: other
    part: TBD-162uH-kQ49

  - id: C2
    name: RX resonant capacitor bank
    kind: other
    part: TBD-1500V-12Arms

  - id: U10
    name: RX rectifier
    kind: power
    part: TBD-SiC-or-synchronous
    notes: >-
      ELE-002 allows 40 W. The v1 bridge is silicon ultrafast described as
      Schottky and spends 25.5 W on conduction alone, leaving nothing for
      recovery loss at 100 kHz. SiC Schottky or synchronous rectification.

  - id: U11
    name: RX link current sense
    kind: sensor
    part: TMCS1133
    powered_by:
      - rail: VEH3V3
        typ_current_a: 0.010
        max_current_a: 0.015

  - id: U12
    name: RX controller
    kind: mcu
    part: STM32G431
    powered_by:
      - rail: VEH3V3
        typ_current_a: 0.050
        max_current_a: 0.100
    notes: (est) retained from v1

  - id: U13
    name: Load-shift keying modulator
    kind: power
    part: TBD-FET-switched-load
    powered_by:
      - rail: VEH12
        typ_current_a: 0.020
        max_current_a: 0.040
    notes: >-
      ELE-015, receiver-to-transmitter direction. Modulates the reflected
      impedance, which is the same quantity the TX resonance tracker follows —
      FW-009 blanks them against each other.

  # ======================= VEHICLE / HVLV =======================
  - id: U20
    name: HVLV high-voltage bridge (4x)
    kind: power
    part: IPB60R120C7
    powered_by:
      - rail: HVDC
        typ_current_a: 7.50
        max_current_a: 8.00
      - rail: VEH12
        typ_current_a: 0.030
        max_current_a: 0.050
    notes: 600 V on a 400 V bus is only 1.5x — ELE-006 wants 650 V. Revisit in E1.

  - id: U21
    name: HVLV planar transformer
    kind: other
    part: TBD-planar-400V-48V
    notes: 8.33:1 nominal. Planar to keep the BOM cost down, per the v1 rationale.

  - id: U22
    name: HVLV low-voltage bridge (16x)
    kind: power
    part: BSC190N15NS3
    powered_by:
      - rail: VEH12
        typ_current_a: 0.120
        max_current_a: 0.200
    notes: >-
      FOUR per branch, not the two of v1. At 48 V the bridge carries 62.5 A,
      about 44 A rms per branch: two devices give 74 W of conduction and blow
      the whole 100 W ELE-003 budget on the LV side alone; four give 37 W.

  - id: U23
    name: HVLV controller
    kind: mcu
    part: STM32H723ZGT6
    powered_by:
      - rail: VEH3V3
        typ_current_a: 0.250
        max_current_a: 0.400
    notes: (est) TIM1/TIM8 phase shift, retained from v1

  - id: U24
    name: PWM and analog isolation
    kind: interface
    part: ISO7740
    powered_by:
      - rail: VEH3V3
        typ_current_a: 0.020
        max_current_a: 0.035
    notes: with ISO224 for the analog path; 800 V reinforced per ELE-011

  - id: U25
    name: HVLV isolated gate bias
    kind: regulator
    part: UCC14240-Q1
    powered_by:
      - rail: VEH12
        typ_current_a: 0.360
        max_current_a: 0.500
    notes: (est) two devices, high side of the HV bridge

  - id: U26
    name: Vehicle aux buck 48V to 12V
    kind: regulator
    part: TPSM5601R5
    powered_by:
      - rail: V48
        typ_current_a: 0.200
        max_current_a: 0.400
    notes: >-
      1.5 A part, not the 600 mA TPSM560R6 — the vehicle side carries two
      controllers and the isolated bias for a 16-FET bridge.

  - id: U27
    name: Vehicle digital buck 12V to 3.3V
    kind: regulator
    part: TPSM560R6
    powered_by:
      - rail: VEH12
        typ_current_a: 0.002
        max_current_a: 0.004

  - id: J3
    name: Pack connector
    kind: connector
    part: TBD-48V-75A
    powered_by:
      - rail: V48
        typ_current_a: 62.5
        max_current_a: 75.0
    notes: >-
      The charge current itself. 62.5 A at 48 V nominal, 75 A at the bottom of
      the SYS-003 pack window, which is what ELE-008 sizes the copper for.

  - id: J4
    name: Vehicle debug header
    kind: connector
    part: FTSH-105-01

# --------------------------------------------------------------------------
# Data buses.
# --------------------------------------------------------------------------
buses:
  - id: SWD_TX
    kind: swd
    between: [J2, U7]

  - id: SWD_VEH
    kind: swd
    between: [J4, U23]

  - id: TX_ADC
    kind: analog
    between: [U8, U7]
    notes: tank current, 1 MHz chain per ELE-010

  - id: TX_PWM
    kind: other
    controller: U7
    members: [U1, U2, U9]
    notes: TIM1 complementary pairs with explicit dead time per FW-004

  - id: RX_ADC
    kind: analog
    between: [U11, U12]

  - id: RX_LSK
    kind: other
    controller: U12
    members: [U13]
    notes: load-shift keying drive, blanked against the TX tracker per FW-009

  - id: VEH_LINK
    kind: uart
    controller: U23
    members: [U12]
    notes: RX controller to HVLV controller, vehicle-side coordination

  - id: HVLV_ISO
    kind: other
    controller: U23
    members: [U24, U20]
    notes: phase-shift PWM across the isolation barrier

  - id: HVLV_LV_PWM
    kind: other
    controller: U23
    members: [U22]

  # The resonant power path. Drawn as buses so the chain the whole design exists
  # to serve is visible on the review image rather than implied.
  - id: PWR_TX_TANK
    kind: other
    between: [U1, C1]
    notes: TX bridge output into the series compensation

  - id: PWR_TX_COIL
    kind: other
    between: [C1, L1]

  - id: PWR_LINK
    kind: other
    between: [L1, L2]
    notes: >-
      THE AIR GAP. 3 kW at 8.33 A rms, k >= 0.40, and the in-band data link of
      SYS-012 rides on this same path.

  - id: PWR_RX_COIL
    kind: other
    between: [L2, C2]

  - id: PWR_RX_RECT
    kind: other
    between: [C2, U10]

  - id: PWR_HVDC_LINK
    kind: other
    between: [U10, U20]

  - id: PWR_DAB_XFMR
    kind: other
    controller: U21
    members: [U20, U22]
    notes: planar transformer, 8.33:1 nominal

  - id: PWR_PACK
    kind: other
    between: [U22, J3]

  - id: LSK_TAP
    kind: other
    between: [U13, C2]
    notes: load-shift keying modulates the RX tank; TX sees it on U8

  - id: DAMP_TAP
    kind: other
    between: [U9, C1]
    notes: handshake damping network across the TX tank
