  from: V48_LEV
  source: U5
  max_current_a: 1.5
  notes: 'Gate-drive and isolated-bias input rail, taken straight from the 48 V Leviathan
    pack. Sized at 1.5 A, not the 600 mA a TPSM560R6 gives: the first pass of this budget
    came out over on a 600 mA part, which is the concrete form of the v1 white paper''s confusion
    between "TPSM540" and "TPSM560".'
- id: TX3V3
  voltage: 3.3
  from: TX12
  source: U6
  max_current_a: 0.6
  notes: 'TX BOARD digital and analog domain. Generated by a buck, not an LDO: 400 mA dropped
    from 12 V to 3.3 V is 3.5 W of heat on a board that already has nowhere to put any.'
