    bottom of the SYS-003 window. (sourced by J0 on the dock sheet)
- id: HV400
  voltage: 400.0
  max_current_a: 10.0
  notes: Dock link bus, made by the Leviathan-side converter running LV->HV. 3 kW at 400 V
    is 7.5 A. No `from` — the DAB is galvanically isolated and U40's declared draw on V48_LEV
    is the referred current. (sourced by U42 on the dock sheet)
- id: TX12
