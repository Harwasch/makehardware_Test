# External reference material — datasheets, application notes, standards.
#
# These files are evidence. Never edit a fetched document; record what you
# retrieved, when, and which requirement needs it.
#
#   revision   the document's own revision string. A datasheet that silently
#              revised under you is a real failure mode; this is how you notice.
#   retrieved  the date you fetched it.
#   needed_by  requirement UIDs that depend on a number in this document.
#   blocked    set when the environment could not fetch it, so a human must.
#              Leave `local: null` and ASK — never substitute a number from
#              memory for a datasheet you could not open.

