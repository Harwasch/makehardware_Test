  # ---- Parts named in the white paper whose numbers need confirming ----------
  # Each of these is a *candidate resolution* of a name in the white paper that
  # does not resolve to a real orderable part. Confirm before any BOM line.
  - id: tpsm560r6-datasheet
    title: TPSM560R6 60-V input, 600-mA step-down power module (integrated inductor)
    part: TPSM560R6
    publisher: Texas Instruments
    url: https://www.ti.com/product/TPSM560R6
    local: null
    blocked: not yet fetched
    notes: >-
      The white paper names both "TPSM540" and "TPSM560"; neither is a valid
      part number. TPSM560R6 (600 mA) and TPSM5601R5 (1.5 A) are the real
      family. The aux-rail budget depends on which — resolve in sourcing.

