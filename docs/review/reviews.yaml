- id: architecture
  title: Architecture — 36 blocks on four readable sheets, 10 rails
  stage: architecture
  summary: 'Re-opened 2026-08-31. The previous architecture packet embedded a diagram with
    eight overlapping block pairs, which you spotted. Root cause: the generator pins the layout
    to hand positions read back out of the .drawio and never tests them for collisions, so
    when rev C added the seven dock-DAB blocks the pre-existing twenty-nine stayed at their
    old coordinates and eight pairs landed on top of each other — and block-diagram --check
    exited 0 on it. Fixed by a fresh layout. Fourteen block names were also being cut mid-word
    at 24 characters and have been shortened in the spec. Beyond that, 36 blocks and 23 buses
    do not fit one readable sheet, so the master spec now carries a sheet: tag per block and
    scripts/block_sheets.py derives four subsystem views from it — dock converter, transmitter,
    receiver, vehicle converter — with stub connectors where a signal leaves the sheet. The
    master stays the single source of truth, so the power budget still rolls up across the
    whole system. Every sheet is checked for overlapping boxes, which is what the gate was
    missing.'
  questions:
  - Are the four sheets the right division — dock converter, transmitter, receiver, vehicle
    converter?
  - V48_LEV and V48_MAKO both sit at 95% of the 80 A their connectors can deliver. That is
    tight enough that I would rather size the connectors up now than discover it at layout.
    Do you want that?
  - HV400 is at 84% of 10 A. Same question, less urgently.
  artifacts:
  - path: docs/design/block-diagram-dock.svg
    sha256: cac7b48c44721a99
