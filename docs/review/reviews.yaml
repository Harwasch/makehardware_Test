# Human review sign-off ledger — written by `review-gate`.
#
# A stage is done when its review here says `approved` and no artefact
# has changed since. The digests are how staleness is detected; do not
# hand-edit them. To record a decision:
#
#   review-gate sign <id> --approve --by <name> --note "what they said"
#   review-gate sign <id> --changes "what they want different"
reviews:
- id: vision
  title: Vision, concepts and the coil decision
  stage: vision
  summary: Scope is the charging system only. Belly dock, no actuator, charging on deck in
    a locating bracket — all decided. The three concepts below differ on how the two pads
    locate to each other, which is the remaining mechanical decision. The coil is settled
    in ADR-0001 as a 16-layer transposed etched PCB, and the write-up says plainly where I
    got it wrong twice before landing there.
  questions:
  - Which locating approach — cone/vee/flat, tapered rails, or perimeter nest?
  - 16 layers at 4 oz is a 64 oz heavy-copper board. Is that acceptable, or should I re-open
