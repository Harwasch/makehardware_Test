- id: requirements
  title: Requirements — 69 requirements, 0% verified
  stage: requirements
  summary: 'Re-opened 2026-08-31 for the scope change. Three requirements moved and three
    are new. VIS-013 states the scope: charger electronics plus a test packaging, integration
    to the mechanical team. VIS-005 and SYS-006 now say pins rather than an unnamed locating
    feature. SYS-017 and MEC-010 specify the test packaging — it has to set the SYS-006 envelope
    to 0.5 mm, because MEC-001 and MEC-003 are both written across that envelope and are closest
    to failing at its corners. The one to read carefully is MEC-009. It was ''the mounting
    bracket is the heat sink'' and the bracket is no longer ours; rather than delete it with
    the bracket, it is re-aimed as an interface requirement we levy on whoever builds the
    mount, and one the test rig must meet itself. The pad sheds 3 W from its own faces and
    has to lose 39 W, so handing over the coil without handing over its heat-sink requirement
    is how a design that closed on paper arrives at a 90 degC pad. Coverage is 0% verified
    and that is correct — no design artefact exists yet, so every gap is a missing evidence
    pointer, not a defect. Nothing has been marked Verified to improve the number.'
  questions:
  - MEC-009's 12x surface area comes from a single unverified 150 W/m2 still-air figure, and
    the whole thermal case rests on it. Do you have a second source, or should I spend a chunk
    confirming it?
  - Is SYS-017's 0.5 mm gap-setting repeatability achievable with shims in your shop, or should
    the rig use a micrometer stage?
  - Are the numbers right — 3.0 kW, 120 W to the coil pair, k times Q of 49, 8-14 mm?
  artifacts:
