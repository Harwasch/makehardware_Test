- id: architecture
  title: Architecture — 29 blocks, 8 rails, two converter instances
  stage: architecture
  summary: 'One bidirectional converter design deployed twice: LV-to-HV on the dock to make
    the 400 V link, HV-to-LV on the vehicle into the pack. Both packs are 48 V so one low-voltage
    specification covers both ends. The power budget closes on every rail. The TX power stage
    is settled in ADR-0002 against a datasheet I read directly; the rest of the parts are
    still open in E1.'
  questions:
  - Is a rail missing, or a bus on the wrong controller?
  - Is one converter design used in both orientations the right call, versus two purpose-built
    ones?
